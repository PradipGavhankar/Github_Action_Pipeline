name: Terraform Full Pipeline (Init to Apply)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Init → Plan → Apply
    runs-on: ubuntu-latest

    env:
      TF_VAR_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      TF_VAR_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      TF_VAR_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: 3. Terraform Format Check
        run: terraform fmt -check

      - name: 4. Terraform Init
        run: terraform init

      - name: 5. Terraform Validate
        run: terraform validate

      - name: 6. Terraform Plan
        run: terraform plan -no-color -input=false

      - name: 7. Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false